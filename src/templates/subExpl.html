<div class="yomikata-sub-expl yomikata-sub-expl-hidden" role="dialog" aria-hidden="true">
  <div class="yomikata-sub-expl-tabs" role="tablist" aria-label="Subtitle explanation">
    <button class="yomikata-sub-expl-tab yomikata-sub-expl-tab-active" type="button" data-tab="word" role="tab" aria-selected="true">
      Word
    </button>
    <button class="yomikata-sub-expl-tab" type="button" data-tab="kanji" role="tab" aria-selected="false">
      Kanji
    </button>
  </div>

  <div class="yomikata-sub-expl-body" data-panel="word">
    <div class="yomikata-sub-expl-title">Word</div>
    <div class="yomikata-sub-expl-content">Hover a subtitle word.</div>
  </div>

  <div class="yomikata-sub-expl-body yomikata-sub-expl-panel-hidden" data-panel="kanji">
    <div class="yomikata-sub-expl-title">Kanji</div>
    <div class="yomikata-sub-expl-content">Kanji details will appear here.</div>
  </div>
</div>
